services:
  db:
    image: ghcr.io/jopolzin/hanabi-live-db:main
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 5s
      retries: 50
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    image: ghcr.io/jopolzin/hanabi-live:main
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}

      # change this to where it's gonna be hosted
      DOMAIN: localhost
      SESSION_SECRET: ${SECRET}

    # if you are deploying this, use your reverse proxy not this!!
    ports:
      - "8080:80"

volumes:
  pgdata:
